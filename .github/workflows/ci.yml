
name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403

      - name: Restore dependencies
        run: dotnet restore IoTPlatform.sln

      - name: Build solution
        run: dotnet build IoTPlatform.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test IoTPlatform.sln --configuration Release --no-build --no-restore
